<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Reel covers</title>
<style>
  @font-face { font-family: Vaz; src: url(../../../public/fonts/vazirmatn-arabic.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0600-06FF, U+0750-077F, U+200C-200F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Vaz; src: url(../../../public/fonts/vazirmatn-latin.woff2) format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d0b14; }
  body { font-family: Vaz, sans-serif; color: #eeebf6; position: relative; }
  #bg { position: absolute; inset: 0; }
  .cover { position: absolute; inset: 0; display: none; }
  .center { position: absolute; left: 0; right: 0; text-align: center; }
  .brand { top: 280px; } .brand img { height: 62px; }
  .ask { font-size: 84px; font-weight: 850; line-height: 1.25; }
  .titlebox { display: inline-block; background: #0b0911; border: 4px solid rgba(255,255,255,.14); border-radius: 30px; padding: 16px 52px 30px; box-shadow: 0 34px 90px rgba(0,0,0,.65); }
  .big { font-size: 124px; font-weight: 900; line-height: 1.2; letter-spacing: -1px; }
  .red { color: #f25466; } .green { color: #26c281; } .lilac { color: #b5a2ff; } .amber { color: #f5b014; }
  .chip { display: inline-block; font-size: 52px; font-weight: 850; padding: 14px 44px 20px; border-radius: 999px; background: rgba(124,92,255,.18); color: #cdbfff; border: 3px solid rgba(124,92,255,.55); }
  .card { background: linear-gradient(180deg, #1c1729, #141020); border: 3px solid #302a44; border-radius: 40px; box-shadow: 0 40px 110px rgba(0,0,0,.6); }
  /* cover 1 */
  #demo { position: absolute; left: 170px; top: 560px; width: 740px; height: 430px; padding: 44px 52px; text-align: right; filter: grayscale(.85) brightness(.75); }
  #demo .k { font-size: 40px; color: #a39cba; font-weight: 700; }
  #demo .v { font-size: 104px; font-weight: 900; direction: ltr; text-align: right; }
  #demo .tag { position: absolute; left: 48px; top: 44px; font-size: 38px; font-weight: 900; color: #f5b014; border: 4px solid #f5b014; border-radius: 16px; padding: 2px 20px 8px; letter-spacing: 3px; }
  #demo .bars { position: absolute; left: 52px; right: 52px; bottom: 48px; height: 100px; display: flex; align-items: flex-end; gap: 14px; }
  #demo .bars i { flex: 1; background: rgba(124,92,255,.35); border-radius: 8px 8px 2px 2px; }
  #x { position: absolute; left: 280px; top: 520px; width: 520px; height: 520px; }
  /* cover 2 */
  #gauge { position: absolute; left: 140px; top: 470px; width: 800px; height: 560px; }
  /* cover 3 */
  .sc { position: absolute; width: 540px; height: 236px; padding: 32px 40px; text-align: right; }
  .sc .n { font-size: 58px; font-weight: 900; }
  .sc .s { font-size: 36px; color: #a39cba; font-weight: 700; margin-top: 4px; }
  .sc svg { position: absolute; left: 36px; bottom: 26px; }
  .stamp { position: absolute; left: 170px; top: 962px; font-size: 52px; font-weight: 900; color: #f25466; border: 6px solid #f25466; border-radius: 20px; padding: 2px 28px 12px; transform: rotate(-7deg); background: rgba(13,11,20,.86); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  /* cover 4 */
  #race { position: absolute; left: 60px; top: 540px; width: 960px; height: 500px; }
</style>
</head>
<body>
<canvas id="bg" width="1080" height="1920"></canvas>

<section class="cover" id="c1">
  <div class="center brand"><img src="../../../brand/svg/logo-fa-dark.svg" alt=""></div>
  <div class="center ask" style="top:400px">تمرین با حساب دمو؟</div>
  <div id="demo" class="card">
    <div class="tag">DEMO</div>
    <div class="k">موجودی حساب دمو</div>
    <div class="v">$10,000</div>
    <div class="bars"><i style="height:40%"></i><i style="height:62%"></i><i style="height:48%"></i><i style="height:80%"></i><i style="height:58%"></i><i style="height:92%"></i><i style="height:70%"></i></div>
  </div>
  <svg id="x" viewBox="0 0 500 500"><g stroke="#f25466" stroke-width="58" stroke-linecap="round"><line x1="90" y1="90" x2="410" y2="410"/><line x1="410" y1="90" x2="90" y2="410"/></g></svg>
  <div class="center" style="top:1090px"><div class="titlebox"><div class="big red">وقت تلف کردنه‼</div></div></div>
  <div class="center" style="top:1390px"><span class="chip">۱۰۰ معامله = ۳ ماه؟</span></div>
</section>

<section class="cover" id="c2">
  <div class="center brand"><img src="../../../brand/svg/logo-fa-dark.svg" alt=""></div>
  <canvas id="gauge" width="800" height="560"></canvas>
  <div class="center" style="top:1060px"><div class="titlebox"><div class="big"><span class="red">و حسابت منفیه‼</span></div></div></div>
  <div class="center" style="top:1370px"><span class="chip">رازی به اسم «امید ریاضی»</span></div>
</section>

<section class="cover" id="c3">
  <div class="center brand"><img src="../../../brand/svg/logo-fa-dark.svg" alt=""></div>
  <div class="center ask" style="top:400px">دنبال یه استراتژی <span class="lilac">جدیدی؟</span></div>
  <div id="fan"></div>
  <div class="stamp">بعد از ۲۰ معامله: ول شد</div>
  <div class="center" style="top:1115px"><div class="titlebox"><div class="big red" style="font-size:94px;white-space:nowrap">استراتژی جدید یاد نگیر‼</div></div></div>
  <div class="center" style="top:1320px"><span class="chip">مشکل، عدد ۲۰ است</span></div>
</section>

<section class="cover" id="c4">
  <div class="center brand"><img src="../../../brand/svg/logo-fa-dark.svg" alt=""></div>
  <div class="center ask" style="top:400px">یه استراتژی <span class="green">سودده</span>…</div>
  <canvas id="race" width="960" height="500"></canvas>
  <div class="center" style="top:1090px"><div class="titlebox"><div class="big red" style="font-size:112px;white-space:nowrap">و حسابت نصف شد‼</div></div></div>
  <div class="center" style="top:1300px"><span class="chip">رازش: ریسک هر معامله</span></div>
</section>

<script>
const W = 1080, H = 1920;
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
function bg(tint) {
  const g = document.getElementById('bg').getContext('2d');
  g.fillStyle = '#0d0b14'; g.fillRect(0, 0, W, H);
  let r = g.createRadialGradient(540, 820, 0, 540, 820, 950);
  r.addColorStop(0, tint); r.addColorStop(0.55, 'rgba(84,48,230,0.10)'); r.addColorStop(1, 'rgba(13,11,20,0)');
  g.fillStyle = r; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,0.04)'; g.lineWidth = 2;
  for (let x = 0; x < W; x += 90) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 90) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  const v = g.createRadialGradient(540, 960, 520, 540, 960, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.7)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
function gauge() {
  const g = document.getElementById('gauge').getContext('2d');
  // a winning gauge…
  g.lineWidth = 56; g.lineCap = 'round';
  g.strokeStyle = 'rgba(255,255,255,0.08)'; g.beginPath(); g.arc(400, 330, 250, Math.PI, 2 * Math.PI); g.stroke();
  g.strokeStyle = '#26c281'; g.beginPath(); g.arc(400, 330, 250, Math.PI, Math.PI + Math.PI * 0.8); g.stroke();
  g.fillStyle = '#eeebf6'; g.font = '900 150px Vaz'; g.textAlign = 'center'; g.direction = 'rtl';
  g.fillText('۸۰٪', 400, 320);
  g.fillStyle = '#a39cba'; g.font = '800 52px Vaz'; g.fillText('وین‌ریت', 400, 400);
  // …and an account going down: many small wins, a few large losses
  const r = rng(4); let v = 0; const pts = [0];
  for (let i = 0; i < 60; i++) { v += r() < 0.8 ? 0.2 : -1; pts.push(v); }
  const lo = Math.min(...pts), hi = Math.max(...pts);
  const X = (i) => 60 + (i / (pts.length - 1)) * 680, Y = (y) => 440 + (1 - (y - lo) / (hi - lo)) * 100;
  g.lineWidth = 10; g.lineJoin = 'round'; g.strokeStyle = '#f25466';
  g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(X(i), Y(p)) : g.moveTo(X(i), Y(p)))); g.stroke();
  g.fillStyle = '#f25466'; g.beginPath(); g.arc(X(pts.length - 1), Y(pts[pts.length - 1]), 16, 0, Math.PI * 2); g.fill();
}
function fan() {
  const S = [['پرایس اکشن', 'هفته‌ی ۱', '#26c281'], ['اسمارت مانی', 'هفته‌ی ۳', '#f25466'], ['ICT', 'هفته‌ی ۶', '#b5a2ff'], ['اسکالپ ۱ دقیقه', 'هفته‌ی ۹', '#f5b014']];
  document.getElementById('fan').innerHTML = S.map(([n, w, c], i) => `<div class="sc card" style="left:${436 - i * 92}px;top:${528 + i * 104}px;transform:rotate(${[2, -2, 1.5, -1.5][i]}deg);filter:brightness(${[0.45, 0.55, 0.7, 1][i]})"><div class="n">${n}</div><div class="s">${w}</div><svg width="240" height="90" viewBox="0 0 360 110" preserveAspectRatio="none"><polyline fill="none" stroke="${c}" stroke-width="7" stroke-linejoin="round" points="${Array.from({ length: 12 }, (_, k) => `${k * 32},${55 + Math.sin(k * 1.3 + i) * 30 + (k % 3) * 6}`).join(' ')}"/></svg></div>`).join('');
}
function race() {
  // the same 100 trades as the reel (35 wins at +3R, 65 losses, longest losing run 8), risked at 1% and 30%
  let seq;
  for (let s = 21; ; s++) {
    const r = rng(s); seq = Array.from({ length: 100 }, (_, i) => i < 35);
    for (let i = 99; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [seq[i], seq[j]] = [seq[j], seq[i]]; }
    let best = 0, cur = 0; seq.forEach((w) => { cur = w ? 0 : cur + 1; best = Math.max(best, cur); });
    if (best === 8) break;
  }
  const path = (k) => { const p = [10000]; seq.forEach((w) => p.push(p[p.length - 1] * (w ? 1 + 3 * k : 1 - k))); return p; };
  const P1 = path(0.01), P30 = path(0.30);
  window.coverFacts = { final1: Math.round(P1[100]), final30: Math.round(P30[100]) };
  const g = document.getElementById('race').getContext('2d');
  g.fillStyle = '#141020'; g.strokeStyle = '#302a44'; g.lineWidth = 3;
  g.beginPath(); g.roundRect(2, 2, 956, 496, 40); g.fill(); g.stroke();
  const lo = Math.log10(1500), hi = Math.log10(2e6), bx = { x: 44, y: 50, w: 520, h: 400 };
  const X = (i) => bx.x + (i / 100) * bx.w, Y = (v) => bx.y + bx.h - ((Math.log10(v) - lo) / (hi - lo)) * bx.h;
  g.setLineDash([12, 12]); g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 3; g.beginPath(); g.moveTo(30, Y(10000)); g.lineTo(930, Y(10000)); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#a39cba'; g.font = '700 30px Vaz'; g.textAlign = 'left'; g.direction = 'ltr'; g.fillText('$10,000', 44, Y(10000) - 14);
  const draw = (P, c, w) => { g.strokeStyle = c; g.lineWidth = w; g.lineJoin = 'round'; g.beginPath(); P.forEach((v, i) => (i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)))); g.stroke(); };
  draw(P30, '#f25466', 9); draw(P1, '#26c281', 9);
  const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const ret = (P) => Math.round((P[100] / 10000 - 1) * 100);
  // [ +46%   risk 1% ] — the label reads right to left, the number left to right
  const tag = (name, P, y, c) => {
    const r = ret(P), val = (r > 0 ? '+' : '-') + fa(Math.abs(r)) + '٪', x = 600, w = 330;
    g.fillStyle = c; g.beginPath(); g.roundRect(x, y - 38, w, 66, 18); g.fill();
    g.fillStyle = '#0d0b14'; g.font = '900 40px Vaz';
    g.direction = 'rtl'; g.textAlign = 'right'; g.fillText(name, x + w - 20, y + 8);
    g.direction = 'ltr'; g.textAlign = 'left'; g.fillText(val, x + 20, y + 8);
  };
  tag('ریسک ۱٪', P1, Y(P1[100]) - 46, '#26c281');
  tag('ریسک ۳۰٪', P30, Y(P30[100]) + 56, '#f25466');
  g.fillStyle = '#f25466'; g.beginPath(); g.arc(X(100), Y(P30[100]), 14, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#26c281'; g.beginPath(); g.arc(X(100), Y(P1[100]), 14, 0, Math.PI * 2); g.fill();
}
window.show = (n) => {
  document.querySelectorAll('.cover').forEach((c) => (c.style.display = 'none'));
  document.getElementById('c' + n).style.display = 'block';
  bg(n === 1 || n === 4 ? 'rgba(242,84,102,0.22)' : 'rgba(124,92,255,0.32)');
  if (n === 2) gauge();
  if (n === 3) fan();
  if (n === 4) race();
};
document.fonts.ready.then(() => { window.ready = true; });
</script>
</body>
</html>
