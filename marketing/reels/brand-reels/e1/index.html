const SHOTS = 'shots/';
const SHOT = (k) => IMG['s_' + k];
const mkc = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c.getContext('2d'); };

const fa1 = (v) => '−' + fa(Math.abs(v), 1) + '٪';

// ---------- camera ----------
const camM = (c) => [c.z, 0, 0, c.z, 540 - c.x * c.z, 960 - c.y * c.z];

/** Dolly between two framings: the frame width moves on a log scale and the centre follows it, so nothing swims. */
function dolly(a, b, k) {
  const wa = 1080 / a.z, wb = 1080 / b.z, w = Math.exp(lerp(Math.log(wa), Math.log(wb), k));
  const u = Math.abs(wb - wa) < 1e-6 ? k : (w - wa) / (wb - wa);
  return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: 1080 / w };
}

// ---------- the world ----------
const R = rng(11);
const BOKEH = Array.from({ length: 70 }, () => ({ x: 80 + R() * 920, y: 600 + R() * 360, r: 7 + R() * 22, c: R() < 0.62 ? '#FFB86B' : R() < 0.55 ? '#7FA8FF' : '#FF7A95', a: 0.22 + R() * 0.4, ph: R() * 6 }));
const BLD = []; { let x = 64; while (x < 1012) { const w = 46 + R() * 96; BLD.push({ x, w, top: 640 + R() * 230, seed: Math.floor(R() * 1e6) }); x += w + 3 + R() * 12; } }

function rad(g, x, y, rx, ry, col, a, op) {
  g.save(); if (op) g.globalCompositeOperation = op; g.translate(x, y); g.scale(1, ry / rx);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx); const c = hexA(col);

}

function windowLayer(g, t, st) {

// ---------- the trader (seen from behind) ----------
function figGeo(t, st) {
  const p = st.pose, br = Math.sin(t * 1.7) * (1 - 0.4 * p);
  const G = { hx: lerp(330, 296, p), hy: lerp(1114, 1046, p) + br * 2, rot: lerp(0.2, 0.03, p), rx: 108, ry: 126,

  const k = E.inOut(clamp(st.arm ?? p));
  G.j0 = { x: G.rsx - 26, y: G.rsy + 46 };
  G.el = { x: lerp(652, 724, k), y: lerp(1402, 1352, k) };
  G.hd = { x: lerp(G.hx + 86, 836, k) - 30 * Math.sin(Math.PI * k), y: lerp(G.hy - 14, 1214, k) - 80 * Math.sin(Math.PI * k) };

}

// F1 · sessions 24…31: the losses shrink, still red, while the sky behind starts to turn
const ACROP = [1000, 655, 1304, 871];
const FSEQ = [[24, 0], [25, 0.17], [26, 0.32], [27, 0.47], [28, 0.62], [29, 0.79], [30, 0.97], [31, 1.19]];
function sceneF1(t) {
  const u = P(t, T.persist, T.dawn - T.persist);
  room(t, NIGHT({ pose: 1, arm: 1, dawn: 0.5 * u, rain: 1 - u, phoneDown: true, scr: 'an24' }), { x: 640, y: 900, z: 1.5 }, { bgBlur: 3 });
  soften(14, 0.48);
  let i = 0; while (i + 1 < FSEQ.length && t - T.persist >= FSEQ[i + 1][1]) i++;
  const [n, t0] = FSEQ[i], sess = DATA.sessions.find((x) => x[0] === n);
  const pop = E.out(P(t - T.persist, t0, 0.12));
  panel('an' + n, ACROP, 540, 980, 1000, { scale: lerp(0.985, 1, pop) });
  pill(540, 420, 'جلسه‌ی ' + fa(n), { size: 34, dot: C.loss, color: C.ink });
  txt(fa1(sess[2]), 540, 560, { size: 136, font: 'Rdx', weight: 800, color: mix('#F25466', '#F58A6E', u), dir: 'ltr', scale: lerp(1.04, 1, pop), glow: rgba(C.loss, 0.35), glowBlur: 50 });
}
// F2 · dawn: same desk, same chair, the rain has stopped; session 31 on the screen. G · the line and the logo
function sceneF2(t) {
  const u = P(t, T.dawn, T.end - T.dawn), dawn = lerp(0.55, 1, E.out(P(t, T.dawn, 1.6)));
  const st = NIGHT({ pose: 1, arm: 1, dawn, rain: 0, phoneDown: true, scr: 'an31', screenOn: 1 });
  const cam = dolly({ x: 540, y: 990, z: 1.06 }, { x: 610, y: 950, z: 1.3 }, E.inOut(P(t, T.dawn, DATA.dur - T.dawn)));
  room(t, st, cam, { bgBlur: 2.5 });
  const g = P(t, T.end - 0.1, 0.9);
  if (g > 0) soften(16 * E.inOut(g), 0.58 * E.inOut(g));
}

// ---------- overlays ----------
function hook(t) {
  const a = 1 - E.in(P(t, 2.9, 0.45)); if (a <= 0) return;
  const tg = cv.createLinearGradient(0, 160, 0, 640); tg.addColorStop(0, `rgba(5,4,10,${0.82 * a})`); tg.addColorStop(1, 'rgba(5,4,10,0)'); cv.fillStyle = tg; cv.fillRect(0, 0, W, 640);
  txt('۳ ماه. ۲۳ جلسه بک‌تست.', 540, 352, { size: 58, font: 'Rdx', weight: 700, color: C.ink, alpha: a });
  txt('هنوز ضرر.', 540, 458, { size: 84, font: 'Rdx', weight: 800, color: C.loss, alpha: a, glow: rgba(C.loss, 0.45), glowBlur: 40 });
}
function chip(t, s, a0, a1, col) { const a = Math.min(E.out(P(t, a0, 0.3)), 1 - E.in(P(t, a1 - 0.25, 0.25))); if (a > 0) pill(540, 330, s, { size: 30, dot: col, alpha: a, color: C.ink, fill: rgba('#0E0C16', 0.7) }); }
function subtitles(t) {
  DATA.subs.forEach((ws, k) => {
    const a0 = ws[0][1] - 0.12, a1 = (k + 1 < DATA.subs.length ? DATA.subs[k + 1][0][1] - 0.12 : ws[ws.length - 1][2] + 0.45);
    if (t < a0 || t > a1) return;
    const out = 1 - E.in(P(t, a1 - 0.15, 0.15)), size = 44, gap = measure(' ', size, 700);
    const rows = []; let cur = []; for (const w of ws) { const test = [...cur, w].map((x) => x[0]).join(' '); if (cur.length && measure(test, size, 700) > 820) { rows.push(cur); cur = [w]; } else cur.push(w); } rows.push(cur);
    rows.forEach((row, ri) => {
      const ww = row.map((w) => measure(w[0], size, 700)), tot = ww.reduce((x, y) => x + y, 0) + gap * (row.length - 1);
      let right = 540 + tot / 2; const y = 1452 - (rows.length - 1 - ri) * 64;
      row.forEach((w, i) => { const p = E.out(P(t, w[1] - 0.06, 0.2)); if (p > 0) txt(w[0], right, y + (1 - p) * 10, { size, weight: 700, color: '#fff', align: 'right', alpha: p * out, stroke: 'rgba(4,3,10,0.6)', strokeW: 9 }); right -= ww[i] + gap; });
    });
  });
}
function endCard(t) {
  const a1 = E.out(P(t, T.end + 0.2, 0.5)), a2 = E.out(P(t, T.end + 0.85, 0.5)), a3 = E.out(P(t, T.end + 1.6, 0.7));
  if (a1 > 0) txt('هر ضرری که اینجا می‌دی،', 540, 840 - 14 * (1 - a1), { size: 60, font: 'Rdx', weight: 700, color: C.ink, alpha: a1 });
  if (a2 > 0) txt('ضرریه که توی حساب واقعی نمی‌دی.', 540, 940 - 14 * (1 - a2), { size: 60, font: 'Rdx', weight: 700, color: '#FFD0A0', alpha: a2, glow: rgba('#FF9F5A', 0.35), glowBlur: 40 });
  if (a3 > 0 && IMG.logo) {
    const h = 66, w = (IMG.logo.width / IMG.logo.height) * h; cv.save(); cv.globalAlpha = a3; cv.drawImage(IMG.logo, 540 - w / 2, 1150 - h / 2, w, h); cv.restore();
    txt('بک‌تست با داده‌ی واقعی بازار', 540, 1232, { size: 30, weight: 500, color: C.muted, alpha: a3 });
  }
}
function dips(t) { for (const c of [T.note, T.decide, T.phone, T.persist, T.dawn]) { const k = 1 - Math.abs(t - c) / 0.09; if (k > 0) { cv.fillStyle = `rgba(3,2,6,${0.85 * k})`; cv.fillRect(0, 0, W, H); } } }

/** The cover (render(-1)): the wide night shot with the hook. */
function cover() {
  room(4.3, NIGHT({}), WIDE, { bgBlur: 2.5 }); reset(cv); finish(4.3);
  const tg = cv.createLinearGradient(0, 160, 0, 700); tg.addColorStop(0, 'rgba(5,4,10,0.85)'); tg.addColorStop(1, 'rgba(5,4,10,0)'); cv.fillStyle = tg; cv.fillRect(0, 0, W, 700);
  txt('۳ ماه. ۲۳ جلسه بک‌تست.', 540, 372, { size: 62, font: 'Rdx', weight: 700, color: C.ink });
  txt('هنوز ضرر.', 540, 486, { size: 96, font: 'Rdx', weight: 800, color: C.loss, glow: rgba(C.loss, 0.45), glowBlur: 40 });
}
function render(t) {
  reset(cv);
  if (t < 0) return cover();
  if (t < T.note) sceneA(t); else if (t < T.decide) sceneB(t); else if (t < T.replay) sceneC(t);
  else if (t < T.phone) sceneD(t); else if (t < T.persist) sceneE(t); else if (t < T.dawn) sceneF1(t); else sceneF2(t);
  reset(cv); finish(t);
  if (t < 3.5) hook(t);
  chip(t, '۲:۴۷ بامداد', 3.15, T.note, C.sky);
  chip(t, '۵:۵۸ صبح', T.dawn + 0.35, T.end + 0.05, C.amber);
  if (t < T.end + 0.1) subtitles(t);
  if (t > T.end) endCard(t);
  dips(t);
}
boot(render, ['an23', 'an24', 'an25', 'an26', 'an27', 'an28', 'an29', 'an30', 'an31', 'r0', 'r1', 'r2', 'r3', 'r4', 'r5', 'journal'].map((k) => loadImg('s_' + k, SHOTS + k + '.jpg')));
