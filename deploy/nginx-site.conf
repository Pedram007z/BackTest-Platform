# nginx site: the web app at https://your-domain/ and the API server at https://your-domain/api/
#   sudo cp nginx-site.conf /etc/nginx/sites-available/backtestlab
#   sudo ln -s /etc/nginx/sites-available/backtestlab /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d backtestlab.ir -d www.backtestlab.ir      (adds HTTPS)
# Replace backtestlab.ir with your domain.

server {
    listen 80;
    listen [::]:80;
    server_name backtestlab.ir www.backtestlab.ir;

    root /var/www/backtestlab;
    index index.html;

    # API server (backtestlab.service, listening on 127.0.0.1:8787)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the API reads the visitor's address from X-Real-IP (TRUST_PROXY=true in .env)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the first load of a month of market data can take a while
        proxy_read_timeout 120s;
        # each user's data (sessions, trades, journals) is saved here; the first upload can be up to 25 MB
        client_max_body_size 26m;
    }

    # the blog, its sitemap and robots.txt: pages the API server renders for search engines
    location ~ ^/(blog(/.*)?|sitemap\.xml|robots\.txt)$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # pictures and videos for announcements (videos up to 100 MB), streamed straight to the API server
    location /api/admin/media {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 101m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # built files carry a content hash in their name: cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # the installable app (PWA): the service worker is checked for updates on every visit
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # Digital Asset Links: lets the Android app (android/) open the site full screen, without a browser bar
    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
}
