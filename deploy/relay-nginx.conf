# Optional relay on a small server OUTSIDE Iran, for when the main server cannot reach Dukascopy,
# Binance or ForexFactory. It forwards only those addresses, and only for the main server.
#   sudo cp relay-nginx.conf /etc/nginx/sites-available/relay && sudo ln -s ../sites-available/relay /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d relay.example.com
# Then in the main server's .env:
#   DUKASCOPY_API_URL=https://relay.example.com/dukascopy-api
#   DUKASCOPY_URL=https://relay.example.com/dukascopy
#   BINANCE_URL=https://relay.example.com/binance
#   FF_BASE_URL=https://relay.example.com/forexfactory
#   FF_FEED_URL=https://relay.example.com/ff_calendar_thisweek.json
# Replace relay.example.com with the relay's domain and 203.0.113.10 with the main server's public IP.

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;

    # only the main server may use the relay
    allow 203.0.113.10;
    deny all;

    proxy_ssl_server_name on;
    proxy_read_timeout 60s;

    # Dukascopy's data API (tried first) and its older datafeed files
    location /dukascopy-api/ {
        proxy_pass https://jetta.dukascopy.com/v1/;
        proxy_set_header Host jetta.dukascopy.com;
    }

    location /dukascopy/ {
        proxy_pass https://datafeed.dukascopy.com/datafeed/;
        proxy_set_header Host datafeed.dukascopy.com;
    }

    location /binance/ {
        proxy_pass https://data-api.binance.vision/;
        proxy_set_header Host data-api.binance.vision;
    }

    location /forexfactory/ {
        proxy_pass https://www.forexfactory.com/;
        proxy_set_header Host www.forexfactory.com;
    }

    location = /ff_calendar_thisweek.json {
        proxy_pass https://nfs.faireconomy.media/ff_calendar_thisweek.json;
        proxy_set_header Host nfs.faireconomy.media;
    }
}
