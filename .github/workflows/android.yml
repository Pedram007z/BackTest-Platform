# The Android app (android/: a Trusted Web Activity that opens https://backtestlab.ir full screen).
# Builds the APK (Cafe Bazaar, Myket, direct download) and the App Bundle (Google Play).
#
# - A push that changes android/ builds both (downloadable from the run's artifacts).
# - A tag android-v<version> (for example android-v1.0.1) also publishes them as a GitHub release.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64 (the .jks file, base64),
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (and ANDROID_KEY_PASSWORD if it differs) the files
# are signed with the release key; without them they are unsigned (see ANDROID.md to sign them).
name: Android app

on:
  push:
    branches: ['**']
    tags: ['android-v*']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Release key (when the repository has it)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: building unsigned files."
          fi

      - name: Build APK and App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Collect the files
        run: |
          version=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle)
          suffix=$([ -n "$SIGNED" ] && echo "" || echo "-unsigned")
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk "../out/backtestlab-$version$suffix.apk"
          cp app/build/outputs/bundle/release/*.aab "../out/backtestlab-$version$suffix.aab"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p 4 ../out/*.apk && echo "APK is aligned"
          if [ -n "$SIGNED" ]; then "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs ../out/*.apk; fi
          cd ../out && sha256sum * | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: out/

      - name: GitHub release (android-v* tags)
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="Android app ${tag#android-v}. APK for Cafe Bazaar, Myket and direct install; AAB for Google Play."
          [ -z "$SIGNED" ] && notes="$notes Unsigned: sign before publishing (ANDROID.md)."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            && gh release upload "$tag" * --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "$tag" * --repo "$GITHUB_REPOSITORY" --title "Android app ${tag#android-v}" --notes "$notes" $([ -z "$SIGNED" ] && echo --prerelease)
